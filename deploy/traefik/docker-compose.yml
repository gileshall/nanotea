version: "3.8"

# nanotea.example.com -> nanotea on the host running it. Traefik terminates TLS; nginx forwards to
# the host with Traefik's X-Forwarded-* headers intact. Replace example.com and the certresolver.

networks:
  traefik-net:
    external: true

configs:
  pub_nginx_v1:
    file: ./nginx.conf

services:
  pub:
    image: nginx:alpine
    networks:
      - traefik-net
    configs:
      - source: pub_nginx_v1
        target: /etc/nginx/conf.d/default.conf
    deploy:
      placement:
        constraints:
          # the host trusts forwarded requests only from this node's address (trusted_proxies).
          - "node.role == manager"
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pub.rule=Host(`nanotea.example.com`)"
        - "traefik.http.services.pub.loadbalancer.server.port=80"
        - "traefik.http.routers.pub.entrypoints=https"
        - "traefik.http.routers.pub.tls.certresolver=default"
        - "traefik.http.routers.pub.tls.domains[0].main=example.com"
        - "traefik.http.routers.pub.tls.domains[0].sans=*.example.com"
