name: e2e

# nanotea deployed several ways with open-source voices, transcription and rewriting, each driven headless as
# its owner and agents. e2e/README.md.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths: ["nanotea/**", "e2e/**", "Dockerfile", "compose.yaml", "docs/docker.config.toml", "deploy/**",
            "pyproject.toml", "uv.lock", ".github/workflows/e2e.yml"]

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        scenario: [native-linux, docker, docker-kokoro]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The images and models need more than the runner has free.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: python3 e2e/run.py --out "$RUNNER_TEMP/e2e" ${{ matrix.scenario }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.scenario }}
          # Not the services' data: their keys are a run's, but keys all the same.
          path: |
            ${{ runner.temp }}/e2e/summary.json
            ${{ runner.temp }}/e2e/*/results.json
            ${{ runner.temp }}/e2e/*/artifacts
            ${{ runner.temp }}/e2e/*/compose.log
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: brew install ffmpeg ollama
      - run: |
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 60); do ollama list > /dev/null 2>&1 && break; sleep 1; done
          ollama pull qwen2.5:0.5b
      - run: |
          uv venv "$RUNNER_TEMP/whisper" --python 3.12
          uv pip install --python "$RUNNER_TEMP/whisper/bin/python" openai-whisper==20250625
      - run: uv sync --locked
      - run: uv run --with playwright==1.63.0 playwright install chromium
      - run: >-
          python3 e2e/run.py --out "$RUNNER_TEMP/e2e" --whisper-python "$RUNNER_TEMP/whisper/bin/python"
          --whisper-model base.en native-macos
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-native-macos
          # Not the services' data: their keys are a run's, but keys all the same.
          path: |
            ${{ runner.temp }}/e2e/summary.json
            ${{ runner.temp }}/e2e/*/results.json
            ${{ runner.temp }}/e2e/*/artifacts
            ${{ runner.temp }}/e2e/*/compose.log
          if-no-files-found: error
