# Ollama for the native Linux run, which happens in the driver container on this project's network.
name: nanotea-ci-native

services:
  ollama:
    image: ollama/ollama:0.12.6
    restart: "no"
    cpus: ${NANOTEA_CI_OLLAMA_CPUS:?}
    mem_limit: 4g
    cpu_shares: 256
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      retries: 30

volumes:
  ollama:
    name: nanotea-ci-cache-ollama
    external: true
