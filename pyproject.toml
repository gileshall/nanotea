[project]
name = "nanotea"
version = "0.1.0"
description = "Direct a whole fleet of coding agents without living in their terminals. Over MCP, for any harness."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Giles Hall", email = "giles@polymerase.org" }]
dependencies = [
    "mcp>=2.3",
    "pywebpush>=2.5.0",
]

[project.optional-dependencies]
# Runs the kokoro tts plugin in this process: uv sync --extra kokoro
kokoro = ["kokoro-onnx>=0.6.1"]

[project.scripts]
nanotea = "nanotea.cli:main"
nanotea-tell = "nanotea.tell:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["matplotlib>=3.10"]
